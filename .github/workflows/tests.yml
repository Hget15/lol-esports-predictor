name: tests

on:
  push:
    branches: [main, v5]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The model libraries depend on NumPy only; the tests exercise the V5
      # library end-to-end on synthetic data, so no dataset is required.
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Run V5 unit tests (warnings are errors — nothing is suppressed)
        run: python -W error -m unittest tests.test_ml_v5 -v

      - name: V4 and V5 library smoke tests
        run: |
          cd src
          python -W error ml_from_scratch.py
          python -W error ml_from_scratch_v5.py
